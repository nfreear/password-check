<!doctype html>
<html lang="en">
<meta charset="utf-8">

<link rel="stylesheet" href="assets/style.css">

<title> password-check </title>

<h1> password-check </h1>

<form>

  <password-check>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" aria-describedby="outputID listID" required>
    </label>
    <button name="showButton" type="button">show</button>
    <output id="outputID"></output>

    <ul id="listID">
      <li data-test="uppercase:1">One uppercase</li>
      <li data-test="lowercase:1">One lowercase</li>
      <li data-test="minlength:8">Min 8 characters</li>
      <li data-test="special:1" data-pattern=";.,$%_-">One special character</li>
      <li data-test="number:1">One number</li>
    </ul>
  </password-check>

  <p>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </p>
</form>


<script type="importmap">
{
  "imports": {
    "password-check": "../src/password-check.js",
    "password-check/app": "./app.js"
  }
}
</script>

<script type="module">
  import demoApp from 'password-check/app';

  demoApp(true);
</script>

</html>
